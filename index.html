<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard</title>
    <style>
        :root { --bg: #1a1a2e; --card: #16213e; --accent: #4ecca3; --text: #ffffff; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 20px; text-align: center; }
        
        .progress-container { background: #0f3460; border-radius: 20px; height: 30px; width: 100%; margin: 20px 0; border: 2px solid var(--accent); overflow: hidden; }
        #progress-bar { background: var(--accent); height: 100%; width: 0%; transition: width 0.5s ease; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; max-width: 500px; margin: 0 auto; }
        .tile { 
            background: var(--card); border-radius: 15px; padding: 30px 10px; 
            border: 2px solid #0f3460; cursor: pointer; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
        }
        .tile.completed { border-color: var(--accent); opacity: 0.3; background: #0f3460; }

        /* Parent Portal Styling */
        #parent-portal { 
            display: none; margin-top: 30px; padding: 20px; 
            background: #243447; border-radius: 15px; border: 2px solid #444; 
            text-align: left; max-width: 500px; margin-left: auto; margin-right: auto;
        }
        .input-group { margin-bottom: 10px; }
        input { width: 90%; padding: 10px; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; }
        
        .admin-trigger-btn { 
            margin-top: 50px; background: transparent; color: #444; 
            border: 1px solid #333; padding: 10px 20px; border-radius: 5px; cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>Control Center</h2>
    <div class="progress-container"><div id="progress-bar"></div></div>
    
    <div class="grid" id="task-grid"></div>

    <div id="status" style="margin-top: 20px; color: #94a3b8;">Systems Ready</div>

    <button class="admin-trigger-btn" onclick="handleSecretTap()">Open Admin Menu (Tap 3x)</button>

    <div id="parent-portal">
        <h3>Edit Missions</h3>
        <div id="editor-list"></div>
        <button onclick="saveTasks()" style="background: var(--accent); padding: 10px 20px; border: none; border-radius: 5px; font-weight: bold;">Save & Close</button>
        <button onclick="resetProgress()" style="padding: 10px 20px; margin-left: 10px;">Reset All Progress</button>
    </div>

<script>
    let tapCount = 0;
    // Default tasks if none exist
    let currentTasks = JSON.parse(localStorage.getItem('myTasks')) || [
        { label: "Mission 1", done: false },
        { label: "Mission 2", done: false },
        { label: "Mission 3", done: false },
        { label: "Mission 4", done: false }
    ];

    function renderBoard() {
        const grid = document.getElementById('task-grid');
        grid.innerHTML = '';
        let doneCount = 0;

        currentTasks.forEach((task, index) => {
            const div = document.createElement('div');
            div.className = `tile ${task.done ? 'completed' : ''}`;
            div.innerHTML = `<span>${task.label}</span>`;
            div.onclick = () => toggleTask(index);
            grid.appendChild(div);
            if(task.done) doneCount++;
        });

        const progress = (doneCount / currentTasks.length) * 100;
        document.getElementById('progress-bar').style.width = progress + '%';
    }

    function toggleTask(index) {
        currentTasks[index].done = !currentTasks[index].done;
        localStorage.setItem('myTasks', JSON.stringify(currentTasks));
        renderBoard();
    }

    function handleSecretTap() {
        tapCount++;
        if (tapCount >= 3) {
            document.getElementById('parent-portal').style.display = 'block';
            renderEditor();
            tapCount = 0;
        }
    }

    function renderEditor() {
        const container = document.getElementById('editor-list');
        container.innerHTML = '';
        currentTasks.forEach((task, i) => {
            container.innerHTML += `<div class="input-group">
                <input type="text" value="${task.label}" id="edit-${i}">
            </div>`;
        });
    }

    function saveTasks() {
        currentTasks.forEach((task, i) => {
            task.label = document.getElementById(`edit-${i}`).value;
        });
        localStorage.setItem('myTasks', JSON.stringify(currentTasks));
        document.getElementById('parent-portal').style.display = 'none';
        renderBoard();
    }

    function resetProgress() {
        currentTasks.forEach(t => t.done = false);
        localStorage.setItem('myTasks', JSON.stringify(currentTasks));
        document.getElementById('parent-portal').style.display = 'none';
        renderBoard();
    }

    renderBoard();
</script>
</body>
</html>
